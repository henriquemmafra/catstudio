[project]
name = "catstudio"
version = "0.1.0"
description = "CatStudio — estúdio web de reconstrução tomográfica construído sobre o núcleo do 3D Slicer"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "A definir pelo autor (ver LICENCAS.md)" }
authors = [{ name = "Henrique Martins dos Santos Filho" }]
dependencies = [
    # trame-slicer 2.0.0 é testado pela Kitware com slicer-core 5.11.0.6 (extra "standalone").
    "trame-slicer[standalone]==2.0.0",
    "slicer-core==5.11.0.6",
    "pydicom>=3,<4",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.45", "pillow", "pylibjpeg", "pylibjpeg-openjpeg", "pyjpegls", "python-gdcm"]

[project.scripts]
catstudio = "catstudio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
